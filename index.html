
<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="" content="default-src *; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://www.google.com">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genshin Randomizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/character.js"></script>
    <script src="js/cookies.js"></script>
  </head>
  <style>
    .element-icon{
      position:absolute;
      margin-left:2px;
      margin-top:2px;
      width: 2.5rem;
    }

    .card:hover{
      transform: scale(1.15);
    }

    .card{
      border: none;
      width: 8rem;
      height: 11rem;
    }

    .break {
      flex-basis: 100%;
    }

    .disabledCard{
      opacity: 0.5;
    }

    .enabledCard{
      opacity: 1;
    }

    h1{
      color:white;
      font-weight: bold;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
    
    input,select{
      margin-bottom: 1rem;
    }
    
    button{
      width: 10rem;
    }

    .pointersEnabled{
      pointer-events: all;
    }

    .pointersDisabled{
      pointer-events: none;
      opacity: 50%;
    }

    img{
      scale: 1.01;
    }

    hr{
      color: white;
      background-color: white;
      height: 0.5rem;
      width: 35rem;
      margin-left:auto;
      margin-right: auto;
    }

    .containers{
      background-color: #4D4F8D;
      padding-top: 1rem;
      padding-bottom:1rem;
      margin-top: 1rem;
      margin-bottom:1rem;
    }

    @media only screen and (max-width: 600px) {
      .card{
        border: none;
        width: 5rem;
        height: 7rem;
      }
      .element-icon{
        position:absolute;
        width: 1.5rem;
      }
      .card-title{
        font-size: 67%;
      }
      hr{
        width: 23rem;
      }
    }

  </style>
  <body onload="initPage()" style="background-color: #585CA7">
 
  

  <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title" id="settingsModalLabel">Settings</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <h5>Teams</h5>
          <select class="form-select" id="teamSelect" onchange="setTeamSlots(this.value);">
            <option value="4">One</option>
            <option value="8" >Two</option>
            <option value="12">Three</option>
          </select>
          <h5>Picks</h2>
          <input type="range" class="form-range" min="2" max="10" id="pickRange" value="3" oninput="tooltip.textContent = this.value;" onchange="setPickSlots(this.value);">
          <div class="text-center" id="tooltip">3</div>
          <h5>Rolls</h5>
          <select class="form-select"  id="rollCountSelect" onchange="setRollCount(this.value);" >
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
            <option value="-1">Infinite</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <h1 class="text-center">Teams</h1>
  
  <hr>

  <div class="container">
    <div class="row">
      <div class="col text-center">
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-danger fw-bold" id="clearButton" onclick="clearState()">Clear</button>
          <button type="button" class="btn btn-primary fw-bold" id="settingsButton" data-bs-toggle="modal" data-bs-target="#settingsModal">Settings</button>
        </div>
      </div>
    </div>
  </div>

  <div class="containers">
    <div id="teamContainer" class="d-flex flex-wrap justify-content-center pointersDisabled"></div>
  </div>
  <h1 class="text-center">Picks</h1>

  <hr>

  <div class="container">
    <div class="row">
      <div class="col text-center">
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-warning fw-bold" id="randomRollButton" onclick="randomRoll()">Roll</button>
          <button type="button" class="btn btn-warning fw-bold disabled" id="randomRollCount">1</button>
        </div>
      </div>
    </div>
  </div>

  <div class="containers">
    <div id="pickerContainer" class="d-flex flex-wrap justify-content-center pointersDisabled"></div>
  </div>

  <h1 class="text-center">Available Characters</h1>

  <hr>

 <div class="container">
    <div class="row">
      <div class="col text-center">
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-danger fw-bold" id="disableButton" onclick="disableAll()">Disable All</button>
          <button type="button" class="btn btn-success fw-bold" id="enableButton" onclick="enableAll()">Enable All</button>
        </div>
      </div>
    </div>
  </div>

  <div class="containers">
    <div id="characterContainer" class="d-flex flex-wrap justify-content-center"></div>
  </div>
  </body>
</html>
